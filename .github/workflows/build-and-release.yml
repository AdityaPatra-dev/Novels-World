name: Build & Release Novels World

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run automated test suite
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Package Android Artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk Novels-World-Android-v1.1.0.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: novels-world-android-apk
          path: Novels-World-Android-v1.1.0.apk
          retention-days: 14

  build-linux:
    name: 🐧 Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Desktop Bundle
        run: flutter build linux --release

      - name: Compress Linux Bundle
        run: tar -czvf Novels-World-Linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: novels-world-linux-x64
          path: Novels-World-Linux-x64.tar.gz
          retention-days: 14

  build-windows:
    name: 🪟 Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Desktop
        run: flutter build windows --release

      - name: Compress Windows Bundle
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Novels-World-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: novels-world-windows-x64
          path: Novels-World-Windows-x64.zip
          retention-days: 14

  build-macos-ios:
    name: 🍎 Build macOS / iOS Bundle
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Compress macOS Bundle
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../Novels-World-macOS-Universal.zip *.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: novels-world-macos
          path: Novels-World-macOS-Universal.zip
          retention-days: 14

  publish-release:
    name: 🚀 Publish Multi-Platform Release
    needs: [build-android, build-linux, build-windows, build-macos-ios]
    if: always() && startsWith(github.ref, 'refs/tags/') && (needs.build-android.result == 'success' || needs.build-linux.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten Artifacts for Release
        run: |
          mkdir -p final-release
          find release-artifacts/ -type f -exec cp {} final-release/ \;
          ls -la final-release/

      - name: Create Multi-Platform GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Novels World ${{ github.ref_name }} 🌟
          files: final-release/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # 📖 Novels World ${{ github.ref_name }} — Multi-Platform Release

            Welcome to the ultimate web novel reading & studio AI audiobook platform!

            ### 📦 Download Packages
            * **📱 Android (APK):** `Novels-World-Android-v1.1.0.apk`
            * **🐧 Linux (x64 Portable):** `Novels-World-Linux-x64.tar.gz`
            * **🪟 Windows (x64):** `Novels-World-Windows-x64.zip`
            * **🍎 macOS (Universal):** `Novels-World-macOS-Universal.zip`

            ### ✨ What's New
            * **🎙️ Continuous Neural Audiobook Stream:** 0ms gapless playback powered by ExoPlayer sample-accurate track transitions and automated 950ms digital silence trimming.
            * **🎭 5 Specialized AI Vocal Engines:** 
              - *Microsoft Neural HD (Studio AI)*
              - *Kokoro-82M (Audiophile Literature Drama)*
              - *Piper Fast Neural (Speed Reading 1.25x–2.5x)*
              - *Sherpa-Matcha (Xianxia & Asian CJK Phonetics)*
              - *Device Native (Offline Hardware)*
            * **🔄 Monotonic FIFO Sequencing:** Guaranteed narrative order preventing short sentences from playing out of order.
            * **🌐 31+ Web Novel Catalogs:** Support for WordPress Madara, Themesia LightNovelWP, NovelFull, ReadWN, Fictioneer, Royal Road, and Scribble Hub with transparent anti-bot clearance.
