name: Build & Release Novels World

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (leave empty for auto tag e.g. v1.3.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run automated test suite
        run: |
          flutter test \
            test/extractors_test.dart \
            test/download_service_test.dart \
            test/epub_reader_test.dart \
            test/global_search_test.dart \
            test/literature_extractors_test.dart \
            test/models_test.dart \
            test/novelfull_card_fix_test.dart \
            test/sequential_fifo_test.dart \
            test/source_registry_test.dart \
            test/tts_engine_test.dart \
            test/webview_session_manager_test.dart \
            test/widget_test.dart

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Package Android Artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk Novels-World-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: novels-world-android-apk
          path: Novels-World-Android.apk
          retention-days: 14

  build-linux:
    name: 🐧 Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Desktop Bundle
        run: flutter build linux --release

      - name: Compress Linux Bundle
        run: tar -czvf Novels-World-Linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: novels-world-linux-x64
          path: Novels-World-Linux-x64.tar.gz
          retention-days: 14

  build-windows:
    name: 🪟 Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Desktop
        run: flutter build windows --release

      - name: Compress Windows Bundle
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Novels-World-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: novels-world-windows-x64
          path: Novels-World-Windows-x64.zip
          retention-days: 14

  build-macos-ios:
    name: 🍎 Build macOS / iOS Bundle
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Compress macOS Bundle
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../Novels-World-macOS-Universal.zip *.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: novels-world-macos
          path: Novels-World-macOS-Universal.zip
          retention-days: 14

  publish-release:
    name: 🚀 Publish Multi-Platform Release
    needs: [build-android, build-linux, build-windows, build-macos-ios]
    if: always() && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)) && (needs.build-android.result == 'success' || needs.build-linux.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: release_info
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Release tag will be: ${TAG}"

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten Artifacts for Release
        run: |
          mkdir -p final-release
          find release-artifacts/ -type f -exec cp {} final-release/ \;
          ls -la final-release/

      - name: Create Multi-Platform GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Novels World ${{ steps.release_info.outputs.tag }} 🌟
          files: final-release/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # 📖 Novels World ${{ steps.release_info.outputs.tag }} — Multi-Platform Release

            Welcome to the ultimate web novel reading & studio AI audiobook platform!

            ### 📦 Download Packages
            * **📱 Android (APK):** `Novels-World-Android.apk`
            * **🐧 Linux (x64 Portable):** `Novels-World-Linux-x64.tar.gz`
            * **🪟 Windows (x64):** `Novels-World-Windows-x64.zip`
            * **🍎 macOS (Universal):** `Novels-World-macOS-Universal.zip`

            ### ✨ What's New
            * **📚 Offline Local EPUB Books:** Import any DRM-free `.epub` file into your library for full offline reading, chapter navigation, and font/theme customization.
            * **📁 Folder Storage Inspector:** Deep-inspect disk storage, cached chapter files, and local paths directly from any novel card.
            * **🎙️ Continuous Neural Audiobook Stream:** 0ms gapless playback powered by ExoPlayer sample-accurate track transitions and automated 950ms digital silence trimming on imported EPUBs and web novels.
            * **🎭 5 Specialized AI Vocal Engines:** 
              - *Microsoft Neural HD (Studio AI)*
              - *Kokoro-82M (Audiophile Literature Drama)*
              - *Piper Fast Neural (Speed Reading 1.25x–2.5x)*
              - *Sherpa-Matcha (Xianxia & Asian CJK Phonetics)*
              - *Device Native (Offline Hardware)*
            * **🔄 Monotonic FIFO Sequencing:** Guaranteed narrative order preventing short sentences from playing out of order.
            * **🌐 40+ Web Novel Catalogs:** Support for WordPress Madara, Themesia LightNovelWP, NovelFull, ReadWN, Fictioneer, Project Gutenberg, AllFreeNovel, RoliaScan, and Asura Scans.
