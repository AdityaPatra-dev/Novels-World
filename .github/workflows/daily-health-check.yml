name: Daily Source Health & Test Automation

on:
  schedule:
    # Runs every day at 04:00 UTC (09:30 AM IST)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      run_sources_check:
        description: 'Run live source availability checks across all websites'
        required: true
        type: boolean
        default: true
      run_tts_check:
        description: 'Run live Microsoft Edge TTS handshake, DRM token & neural synthesis checks'
        required: true
        type: boolean
        default: true
      run_unit_tests:
        description: 'Run core unit and parser test suites'
        required: true
        type: boolean
        default: true
      run_analysis:
        description: 'Run static code analysis (flutter analyze)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    name: 🔍 Comprehensive Daily Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 📦 Install Flutter Dependencies
        run: |
          flutter pub get
          mkdir -p build/reports

      - name: 🧐 Static Analysis
        id: analysis
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_analysis }}
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: 🧪 Run Core Unit Tests
        id: unit_tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_unit_tests }}
        continue-on-error: true
        run: |
          flutter test \
            test/extractors_test.dart \
            test/download_service_test.dart \
            test/epub_reader_test.dart \
            test/global_search_test.dart \
            test/literature_extractors_test.dart \
            test/models_test.dart \
            test/novelfull_card_fix_test.dart \
            test/sequential_fifo_test.dart \
            test/source_registry_test.dart \
            test/tts_engine_test.dart \
            test/app_update_service_test.dart \
            test/webview_session_manager_test.dart \
            test/widget_test.dart

      - name: 🌐 Run Daily Live Source Health Suite
        id: sources_check
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_sources_check }}
        continue-on-error: true
        run: flutter test test/sources_health_check_test.dart

      - name: 🎙️ Run Daily Neural TTS Health & Handshake Suite
        id: tts_check
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tts_check }}
        continue-on-error: true
        run: flutter test test/tts_live_health_test.dart test/tts_cross_chapter_test.dart

      - name: 📢 Report Status & Manage GitHub Issue
        if: false
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATIC_ANALYSIS_STATUS: ${{ steps.analysis.outcome }}
          TEST_SUITE_STATUS: ${{ steps.unit_tests.outcome }}
          SOURCE_HEALTH_STATUS: ${{ steps.sources_check.outcome }}
          TTS_HEALTH_STATUS: ${{ steps.tts_check.outcome }}
        run: |
          python3 tool/report_github_issue.py

      - name: 📤 Upload Health Check Reports & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health-reports
          path: build/reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: 🚨 Verify Overall Build Result
        if: steps.analysis.outcome == 'failure' || steps.unit_tests.outcome == 'failure'
        run: |
          echo "::error::Critical failure: static analysis or unit test suite failed."
          exit 1

