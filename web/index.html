  <!-- Native Web Speech API Bridge for Novels World TTS -->
  <script>
    (function() {
      // Unregister any stale service workers and clear caches on app load
      if ('serviceWorker' in navigator) {
        try {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var r of regs) { r.unregister(); }
          });
        } catch(e) {}
      }
      if ('caches' in window) {
        try {
          caches.keys().then(function(keys) {
            for (var k of keys) { caches.delete(k); }
          });
        } catch(e) {}
      }

      var voicesList = [];

      function populateVoices() {
        if ('speechSynthesis' in window) {
          try {
            voicesList = window.speechSynthesis.getVoices() || [];
          } catch(e) {}
        }
      }

      if ('speechSynthesis' in window) {
        populateVoices();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
          window.speechSynthesis.onvoiceschanged = populateVoices;
        }
      }

      var resumeTimer = null;

      window.novelsWorldTts = {
        isSpeaking: false,
        isPaused: false,

        getVoicesJson: function() {
          if (!('speechSynthesis' in window)) return '[]';
          if (!voicesList || voicesList.length === 0) {
            populateVoices();
          }
          var v = voicesList || [];
          var en = v.filter(function(item) {
            return item.lang && item.lang.toLowerCase().indexOf('en') === 0;
          });
          var other = v.filter(function(item) {
            return !item.lang || item.lang.toLowerCase().indexOf('en') !== 0;
          });
          var combined = en.length > 0 ? en.concat(other) : v;
          var mapped = combined.map(function(item) {
            var n = (item.name || '').toLowerCase();
            var isFemale = /female|woman|girl|samantha|zira|jenny|aria|sonia|karen|victoria|luna|emma|michelle|libby|neerja/i.test(n);
            var isMale = /male|man|boy|david|guy|christopher|george|daniel|andrew|eric|roger|thomas|steffan|liam|wayne|prabhat|brian|ryan/i.test(n);
            var gender = isFemale ? 'Female' : (isMale ? 'Male' : 'Neutral');
            return {
              name: item.name || 'System Voice',
              lang: item.lang || 'en-US',
              gender: gender,
              default: item.default || false
            };
          });
          return JSON.stringify(mapped);
        },

        speak: function(text, voiceName, rate, pitch, onDone, isSequential) {
          if (!('speechSynthesis' in window)) {
            console.warn('[NovelsWorld TTS] Web Speech API not supported.');
            if (typeof onDone === 'function') onDone();
            return;
          }

          if (resumeTimer) {
            clearInterval(resumeTimer);
            resumeTimer = null;
          }

          // Do NOT cancel during seamless line-to-line transitions!
          // Canceling tears down the browser audio pipeline and causes a 1-second delay.
          if (!isSequential) {
            try {
              window.speechSynthesis.cancel();
            } catch(e) {}
          }

          var clean = (text || '').trim();
          if (!clean) {
            if (typeof onDone === 'function') onDone();
            return;
          }

          var u = new SpeechSynthesisUtterance(clean);
          u.rate = Math.max(0.5, Math.min(2.5, rate || 1.0));
          u.pitch = Math.max(0.5, Math.min(2.0, pitch || 1.0));

          if (!voicesList || voicesList.length === 0) {
            populateVoices();
          }

          if (voicesList && voicesList.length > 0) {
            var selectedVoice = null;
            if (voiceName && window._nwCachedTargetName === voiceName && window._nwCachedVoice) {
              selectedVoice = window._nwCachedVoice;
            } else {
              if (voiceName) {
                var target = voiceName.toLowerCase();
                selectedVoice = voicesList.find(function(v) {
                  return v.name && v.name.toLowerCase().indexOf(target) !== -1;
                });
              }
              if (!selectedVoice) {
                // Priority 1: Natural / Google English voices
                selectedVoice = voicesList.find(function(v) {
                  var lang = (v.lang || '').toLowerCase();
                  var name = (v.name || '').toLowerCase();
                  return lang.indexOf('en') === 0 && (name.indexOf('natural') !== -1 || name.indexOf('google') !== -1 || name.indexOf('samantha') !== -1);
                });
              }
              if (!selectedVoice) {
                // Priority 2: Any English voice
                selectedVoice = voicesList.find(function(v) {
                  return (v.lang || '').toLowerCase().indexOf('en') === 0;
                });
              }
              if (!selectedVoice) {
                selectedVoice = voicesList[0];
              }
              window._nwCachedTargetName = voiceName;
              window._nwCachedVoice = selectedVoice;
            }
            if (selectedVoice) {
              u.voice = selectedVoice;
              u.lang = selectedVoice.lang || 'en-US';
            }
          }

          var finished = false;
          function complete() {
            if (finished) return;
            finished = true;
            window.novelsWorldTts.isSpeaking = false;
            if (resumeTimer) {
              clearInterval(resumeTimer);
              resumeTimer = null;
            }
            if (typeof onDone === 'function') {
              try {
                onDone();
              } catch(err) {
                console.error('[NovelsWorld TTS] onDone error:', err);
              }
            }
          }

          u.onend = complete;
          u.onerror = function(ev) {
            console.warn('[NovelsWorld TTS] utterance error/cancel:', ev);
            complete();
          };

          // Chrome speech synthesis stall watchdog
          var wordCount = clean.split(/\s+/).length;
          var safeTimeoutMs = Math.max(6000, wordCount * 1200);
          var watchdog = setTimeout(complete, safeTimeoutMs);

          var originalEnd = u.onend;
          u.onend = function() {
            clearTimeout(watchdog);
            originalEnd();
          };
          var originalErr = u.onerror;
          u.onerror = function(ev) {
            clearTimeout(watchdog);
            originalErr(ev);
          };

          window.novelsWorldTts.isSpeaking = true;
          window.novelsWorldTts.isPaused = false;

          try {
            window.speechSynthesis.speak(u);
            if (window.speechSynthesis.paused) {
              window.speechSynthesis.resume();
            }
          } catch(e) {
            console.error('[NovelsWorld TTS] speak exception:', e);
            complete();
            return;
          }

          // Keep-alive for long speeches in Chrome
          resumeTimer = setInterval(function() {
            if (window.speechSynthesis.speaking && !window.novelsWorldTts.isPaused) {
              window.speechSynthesis.resume();
            } else if (!window.speechSynthesis.speaking) {
              clearInterval(resumeTimer);
              resumeTimer = null;
            }
          }, 10000);
        },

        playChapter: function(sentencesJson, startIndex, voiceName, rate, pitch, onSentenceChanged, onDone) {
          if (!('speechSynthesis' in window)) {
            if (typeof onDone === 'function') onDone();
            return;
          }
          try { window.speechSynthesis.cancel(); } catch(e) {}

          var sentences = [];
          try {
            sentences = typeof sentencesJson === 'string' ? JSON.parse(sentencesJson) : sentencesJson;
          } catch(e) {
            sentences = [];
          }
          if (!sentences || sentences.length === 0) {
            if (typeof onDone === 'function') onDone();
            return;
          }

          var currentIndex = Math.max(0, Math.min(startIndex || 0, sentences.length - 1));
          var isPlaying = true;
          window.novelsWorldTts.isSpeaking = true;
          window.novelsWorldTts.isPaused = false;

          if (resumeTimer) {
            clearInterval(resumeTimer);
            resumeTimer = null;
          }

          if (!voicesList || voicesList.length === 0) {
            populateVoices();
          }

          var activeVoice = null;
          if (voicesList && voicesList.length > 0) {
            if (voiceName && window._nwCachedTargetName === voiceName && window._nwCachedVoice) {
              activeVoice = window._nwCachedVoice;
            } else {
              if (voiceName) {
                var target = voiceName.toLowerCase();
                activeVoice = voicesList.find(function(v) {
                  return v.name && v.name.toLowerCase().indexOf(target) !== -1;
                });
              }
              if (!activeVoice) {
                activeVoice = voicesList.find(function(v) {
                  var lang = (v.lang || '').toLowerCase();
                  var name = (v.name || '').toLowerCase();
                  return lang.indexOf('en') === 0 && (name.indexOf('natural') !== -1 || name.indexOf('google') !== -1);
                });
              }
              if (!activeVoice) {
                activeVoice = voicesList.find(function(v) {
                  return (v.lang || '').toLowerCase().indexOf('en') === 0;
                });
              }
              if (!activeVoice) activeVoice = voicesList[0];
              window._nwCachedTargetName = voiceName;
              window._nwCachedVoice = activeVoice;
            }
          }

          function queueUtterance(index) {
            if (!isPlaying || index >= sentences.length) return;
            var text = (sentences[index] || '').trim();
            if (!text) {
              queueUtterance(index + 1);
              return;
            }

            var u = new SpeechSynthesisUtterance(text);
            u.rate = Math.max(0.5, Math.min(2.5, rate || 1.0));
            u.pitch = Math.max(0.5, Math.min(2.0, pitch || 1.0));
            if (activeVoice) {
              u.voice = activeVoice;
              u.lang = activeVoice.lang || 'en-US';
            }

            var started = false;
            var nextQueued = false;
            function ensureNextQueued() {
              if (nextQueued) return;
              nextQueued = true;
              queueUtterance(index + 1);
            }

            u.onstart = function() {
              if (!isPlaying || started) return;
              started = true;
              window.novelsWorldTts.isSpeaking = true;
              window.novelsWorldTts.isPaused = false;
              if (typeof onSentenceChanged === 'function') {
                try { onSentenceChanged(index); } catch(err) {}
              }
              // Pre-queue the NEXT sentence in the browser audio pipeline for 0ms transition!
              ensureNextQueued();
            };

            u.onend = function() {
              if (!isPlaying) return;
              ensureNextQueued();
              if (index >= sentences.length - 1) {
                isPlaying = false;
                window.novelsWorldTts.isSpeaking = false;
                if (typeof onDone === 'function') {
                  try { onDone(); } catch(err) {}
                }
              }
            };

            u.onerror = function(ev) {
              if (!isPlaying) return;
              ensureNextQueued();
              if (index >= sentences.length - 1) {
                isPlaying = false;
                window.novelsWorldTts.isSpeaking = false;
                if (typeof onDone === 'function') {
                  try { onDone(); } catch(err) {}
                }
              }
            };

            try {
              window.speechSynthesis.speak(u);
            } catch(e) {
              console.error('[NovelsWorld TTS] speak exception:', e);
            }
          }

          // Start from requested index
          queueUtterance(currentIndex);

          // Keep-alive for long speeches in Chrome
          resumeTimer = setInterval(function() {
            if (window.speechSynthesis.speaking && !window.novelsWorldTts.isPaused) {
              window.speechSynthesis.resume();
            } else if (!window.speechSynthesis.speaking) {
              clearInterval(resumeTimer);
              resumeTimer = null;
            }
          }, 10000);
        },

        pause: function() {
          window.novelsWorldTts.isPaused = true;
          if ('speechSynthesis' in window) {
            try {
              window.speechSynthesis.pause();
            } catch(e) {}
          }
        },

        resume: function() {
          window.novelsWorldTts.isPaused = false;
          if ('speechSynthesis' in window) {
            try {
              window.speechSynthesis.resume();
            } catch(e) {}
          }
        },

        stop: function() {
          window.novelsWorldTts.isSpeaking = false;
          window.novelsWorldTts.isPaused = false;
          if (resumeTimer) {
            clearInterval(resumeTimer);
            resumeTimer = null;
          }
          if ('speechSynthesis' in window) {
            try {
              window.speechSynthesis.cancel();
            } catch(e) {}
          }
        }
      };
    })();
  </script>

        for (var r of regs) { r.unregister(); }
      }).catch(function() {});

    // Purge any stale cache storage
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var n of names) { caches.delete(n); }
      }).catch(function() {});
    }

    // Force cache-busting timestamp on main.dart.js so browsers never serve a cached script
    var cacheBuster = 't=' + new Date().getTime();
    if (window._flutter && window._flutter.buildConfig && window._flutter.buildConfig.builds) {
      window._flutter.buildConfig.builds.forEach(function(b) {
        if (b.mainJsPath) {
          b.mainJsPath = b.mainJsPath + '?' + cacheBuster;
